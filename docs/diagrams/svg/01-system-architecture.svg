<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L10,5 z" fill="context-stroke"/></marker><marker id="arrow-open" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs><rect width="100%" height="100%" fill="#F8FAFC"/><text x="80" y="78" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#172033">MiniTrack — system architecture</text><text x="80" y="118" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#475569">React SPA over a layered FastAPI service on standard-library sqlite3</text><rect x="70" y="175" width="400" height="460" rx="18" fill="#EEF2FF" fill-opacity="0.35" stroke="#4F46E5" stroke-width="1.8" stroke-dasharray="8 6"/><text x="88" y="204" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#312E81">Client — frontend/</text><rect x="545" y="175" width="330" height="460" rx="18" fill="#CCFBF1" fill-opacity="0.35" stroke="#0D9488" stroke-width="1.8" stroke-dasharray="8 6"/><text x="563" y="204" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#115E59">ASGI middleware</text><rect x="940" y="175" width="545" height="570" rx="18" fill="#CCFBF1" fill-opacity="0.35" stroke="#0D9488" stroke-width="1.8" stroke-dasharray="8 6"/><text x="958" y="204" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#115E59">Backend — backend/app/</text><rect x="70" y="790" width="1415" height="165" rx="18" fill="#DCFCE7" fill-opacity="0.35" stroke="#16A34A" stroke-width="1.8" stroke-dasharray="8 6"/><text x="88" y="819" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#166534">Verification surfaces</text><line x1="270" y1="324" x2="270" y2="345" stroke="#4F46E5" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="270" y1="449" x2="270" y2="470" stroke="#4F46E5" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="439" y1="522" x2="560" y2="278" stroke="#0D9488" stroke-width="2.2" marker-end="url(#arrow)"/><text x="500" y="392" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#115E59" paint-order="stroke" stroke="#F8FAFC" stroke-width="7" stroke-linejoin="round">HTTP + X-API-Key</text><line x1="710" y1="324" x2="710" y2="345" stroke="#0D9488" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="710" y1="449" x2="710" y2="470" stroke="#0D9488" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="854" y1="522" x2="960" y2="275" stroke="#0D9488" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="1338" y1="336" x2="1212" y2="325" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><line x1="1088" y1="419" x2="1212" y2="430" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><text x="1150" y="416" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E293B" paint-order="stroke" stroke="#F8FAFC" stroke-width="7" stroke-linejoin="round">constructs</text><line x1="1212" y1="319" x2="1212" y2="430" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="1212" y1="524" x2="1212" y2="535" stroke="#B45309" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="1212" y1="629" x2="1212" y2="640" stroke="#B45309" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="1459" y1="688" x2="1550" y2="615" stroke="#B45309" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="105" y="235" width="330" height="85" rx="14" fill="#F1F5F9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/><text x="270" y="268" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E293B">Browser</text><text x="270" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">sessionStorage · fetch</text><rect x="105" y="355" width="330" height="90" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="270" y="391" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#312E81">React SPA</text><text x="270" y="415" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">React 19.2 · Vite 8.1 · TypeScript 6.0</text><rect x="105" y="480" width="330" height="85" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="270" y="514" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#312E81">src/api/client.ts</text><text x="270" y="538" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">the only fetch() in the app</text><rect x="570" y="235" width="280" height="85" rx="14" fill="#CCFBF1" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/><text x="710" y="268" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#115E59">CORSMiddleware</text><text x="710" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">MINITRACK_CORS_ORIGINS</text><rect x="570" y="355" width="280" height="90" rx="14" fill="#CCFBF1" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/><text x="710" y="391" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#115E59">RequestContextMiddleware</text><text x="710" y="415" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">uuid4 → X-Request-ID</text><rect x="570" y="480" width="280" height="85" rx="14" fill="#CCFBF1" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/><text x="710" y="514" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#115E59">ExceptionMiddleware</text><text x="710" y="538" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">app/core/errors.py</text><rect x="970" y="235" width="485" height="80" rx="14" fill="#CCFBF1" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/><text x="1212" y="266" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#115E59">app/api/routes/</text><text x="1212" y="290" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">health.py · tasks.py</text><rect x="970" y="340" width="235" height="75" rx="14" fill="#CCFBF1" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/><text x="1088" y="368" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#115E59">app/api/deps.py</text><text x="1088" y="392" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">DI wiring</text><rect x="1220" y="340" width="235" height="75" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" filter="url(#shadow)"/><text x="1338" y="368" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E293B">app/core/security.py</text><text x="1338" y="392" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">X-API-Key</text><rect x="970" y="440" width="485" height="80" rx="14" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/><text x="1212" y="471" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#5B21B6">app/services/task_service.py</text><text x="1212" y="495" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">raises TaskNotFound · no FastAPI import</text><rect x="970" y="545" width="485" height="80" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2" filter="url(#shadow)"/><text x="1212" y="576" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#92400E">app/data/task_repository.py</text><text x="1212" y="600" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">the only task SQL</text><rect x="970" y="650" width="485" height="75" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2" filter="url(#shadow)"/><text x="1212" y="678" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#92400E">app/data/database.py</text><text x="1212" y="702" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">the only sqlite3.connect()</text><rect x="1560" y="560" width="285" height="110" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2" filter="url(#shadow)"/><text x="1702" y="606" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#92400E">backend/minitrack.db</text><text x="1702" y="630" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">SQLite 3.53.3 · 1 table · 0 indexes</text><rect x="105" y="845" width="320" height="80" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="2" filter="url(#shadow)"/><text x="265" y="876" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#166534">Vitest 4.1 + jsdom</text><text x="265" y="900" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">86 tests over frontend/src</text><rect x="455" y="845" width="320" height="80" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="2" filter="url(#shadow)"/><text x="615" y="876" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#166534">pytest 8.3 + TestClient</text><text x="615" y="900" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">54 tests over backend/</text><rect x="805" y="845" width="320" height="80" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="2" filter="url(#shadow)"/><text x="965" y="876" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#166534">Playwright 1.62</text><text x="965" y="900" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">e2e/ — 16 tests, boots both halves</text><rect x="1155" y="845" width="300" height="80" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" filter="url(#shadow)"/><text x="1305" y="876" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E293B">MINITRACK_* env</text><text x="1305" y="900" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">backend/.env → uvicorn --env-file</text><rect x="1500" y="190" width="350" height="175" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1514" y="218" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#115E59">Every /tasks call from the browser is</text><text x="1514" y="239" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#115E59">preflighted, because X-API-Key is a</text><text x="1514" y="260" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#115E59">non-simple header. With</text><text x="1514" y="281" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#115E59">MINITRACK_CORS_ORIGINS empty,</text><text x="1514" y="302" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#115E59">CORSMiddleware is not installed at all and</text><text x="1514" y="323" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#115E59">the SPA cannot reach the API.</text><rect x="1500" y="700" width="350" height="120" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1514" y="728" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#92400E">No ORM, no migrations, no connection pool.</text><text x="1514" y="749" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#92400E">The schema is CREATE TABLE IF NOT EXISTS,</text><text x="1514" y="770" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#92400E">re-run on every connect().</text><text x="80" y="1024" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#475569">Reading the diagram: three peer modules — backend/, frontend/, e2e/. Requests flow left to right and top to bottom; app/core/ and app/schemas/ are</text><text x="80" y="1048" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#475569">cross-cutting and are drawn in 02-backend-components.</text></svg>
