<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L10,5 z" fill="context-stroke"/></marker><marker id="arrow-open" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs><rect width="100%" height="100%" fill="#F8FAFC"/><text x="80" y="78" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#172033">Connecting with an API key</text><text x="80" y="118" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#475569">/connect → validate against a real protected endpoint → store the key</text><rect x="70" y="527" width="1780" height="269" rx="12" fill="#DCFCE7" fill-opacity="0.40" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="7 5"/><text x="84" y="548" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#166534">alt  [key accepted]</text><rect x="70" y="787" width="1780" height="190" rx="12" fill="#FEE2E2" fill-opacity="0.40" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="7 5"/><text x="84" y="808" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#991B1B">alt  [key rejected]</text><line x1="235" y1="248" x2="235" y2="999" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="105" y="172" width="260" height="76" rx="12" fill="#F1F5F9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/><text x="235" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1E293B">Browser</text><line x1="525" y1="248" x2="525" y2="999" stroke="#4F46E5" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="395" y="172" width="260" height="76" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="525" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#312E81">ConnectPage.tsx</text><line x1="815" y1="248" x2="815" y2="999" stroke="#4F46E5" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="685" y="172" width="260" height="76" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="815" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#312E81">api/tasks.ts</text><line x1="1105" y1="248" x2="1105" y2="999" stroke="#4F46E5" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="975" y="172" width="260" height="76" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="1105" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#312E81">api/client.ts</text><line x1="1395" y1="248" x2="1395" y2="999" stroke="#0D9488" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="1265" y="172" width="260" height="76" rx="12" fill="#CCFBF1" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/><text x="1395" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#115E59">core/security.py</text><line x1="1685" y1="248" x2="1685" y2="999" stroke="#16A34A" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="1555" y="172" width="260" height="76" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2" filter="url(#shadow)"/><text x="1685" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#166534">auth/apiKeyStore.ts</text><line x1="241" y1="300" x2="513" y2="300" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="380" y="291" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">submit form</text><line x1="531" y1="338" x2="803" y2="338" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="670" y="329" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">validateApiKey(candidate)</text><line x1="821" y1="377" x2="1093" y2="377" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="960" y="368" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E293B">request(&apos;/tasks&apos;, { limit: 1 }, apiKey)</text><path d="M1105 407 h44 v18 h-44" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/><text x="1161" y="422" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E293B">usedExplicitKey = true</text><line x1="1111" y1="455" x2="1383" y2="455" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1250" y="446" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">GET /tasks?limit=1</text><text x="1250" y="472" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">header X-API-Key: candidate</text><path d="M1395 499 h44 v18 h-44" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/><text x="1451" y="514" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E293B">hmac.compare_digest over UTF-8 bytes</text><line x1="1389" y1="573" x2="1117" y2="573" stroke="#16A34A" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="1250" y="564" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#166534">200 — a bare array</text><line x1="1099" y1="612" x2="827" y2="612" stroke="#16A34A" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="960" y="603" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#166534">Task[]</text><line x1="531" y1="651" x2="1673" y2="651" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1105" y="642" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#166534">connect(candidate, { remember })</text><path d="M1685 681 h44 v18 h-44" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow)"/><text x="1741" y="696" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#166534">writeStored() → sessionStorage, if remember</text><line x1="1679" y1="729" x2="537" y2="729" stroke="#16A34A" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="1105" y="720" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#166534">notify → isConnected = true</text><line x1="519" y1="768" x2="247" y2="768" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arrow)"/><text x="380" y="759" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#166534">navigate(from, { replace: true })</text><line x1="1389" y1="833" x2="1117" y2="833" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="1250" y="824" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#991B1B">401 { detail: &apos;Invalid or missing API key&apos; }</text><path d="M1105 863 h44 v18 h-44" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow)"/><text x="1161" y="878" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#991B1B">401 but usedExplicitKey → skip handler</text><line x1="1099" y1="911" x2="537" y2="911" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="815" y="902" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#991B1B">throw ApiClientError</text><line x1="519" y1="949" x2="247" y2="949" stroke="#DC2626" stroke-width="2.2" marker-end="url(#arrow)"/><text x="380" y="940" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#991B1B">&apos;That API key was rejected.&apos;</text><text x="80" y="1024" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#475569">Validation deliberately hits /tasks?limit=1, not /health: /health is public and would accept a wrong key. Passing the key explicitly is what stops a</text><text x="80" y="1048" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#475569">rejected candidate from tearing down a live session.</text></svg>
