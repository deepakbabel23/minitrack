<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L10,5 z" fill="context-stroke"/></marker><marker id="arrow-open" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs><rect width="100%" height="100%" fill="#F8FAFC"/><text x="80" y="78" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#172033">Completing a task — one way only</text><text x="80" y="118" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#475569">The row is updated in place, never removed from the list</text><line x1="214" y1="248" x2="214" y2="1000" stroke="#4F46E5" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="103" y="172" width="222" height="76" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="214" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#312E81">TaskCard.tsx</text><line x1="462" y1="248" x2="462" y2="1000" stroke="#4F46E5" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="351" y="172" width="222" height="76" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="462" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#312E81">TaskListPage.tsx</text><line x1="711" y1="248" x2="711" y2="1000" stroke="#7C3AED" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="600" y="172" width="222" height="76" rx="12" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/><text x="711" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#5B21B6">useTaskList.ts</text><line x1="960" y1="248" x2="960" y2="1000" stroke="#4F46E5" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="849" y="172" width="222" height="76" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="960" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#312E81">api/tasks.ts</text><line x1="1208" y1="248" x2="1208" y2="1000" stroke="#0D9488" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="1097" y="172" width="222" height="76" rx="12" fill="#CCFBF1" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/><text x="1208" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#115E59">routes/tasks.py</text><line x1="1457" y1="248" x2="1457" y2="1000" stroke="#7C3AED" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="1346" y="172" width="222" height="76" rx="12" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/><text x="1457" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#5B21B6">task_service.py</text><line x1="1705" y1="248" x2="1705" y2="1000" stroke="#B45309" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="1594" y="172" width="222" height="76" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2" filter="url(#shadow)"/><text x="1705" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#92400E">task_repository.py</text><line x1="220" y1="300" x2="450" y2="300" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="338" y="291" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">onComplete(task)</text><path d="M462 335 h44 v18 h-44" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/><text x="518" y="350" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E293B">setBusyTaskId(task.id)</text><line x1="468" y1="388" x2="948" y2="388" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="711" y="379" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">completeTask(task.id)</text><line x1="966" y1="433" x2="1196" y2="433" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1084" y="424" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">POST /tasks/{id}/complete</text><text x="1084" y="450" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">no body, so no Content-Type header</text><line x1="1214" y1="491" x2="1445" y2="491" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1332" y="482" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">complete_task(task_id)</text><line x1="1463" y1="536" x2="1693" y2="536" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1581" y="527" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">set_completed(task_id, True)</text><path d="M1705 571 h44 v18 h-44" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/><text x="1761" y="586" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E293B">check → UPDATE completed = 1 → re-fetch</text><line x1="1699" y1="639" x2="1469" y2="639" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="1581" y="630" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">dict or None</text><path d="M1457 674 h44 v18 h-44" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow)"/><text x="1513" y="689" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#991B1B">None → raise TaskNotFound(task_id)</text><line x1="1451" y1="727" x2="1220" y2="727" stroke="#16A34A" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="1332" y="718" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#166534">dict</text><line x1="1202" y1="772" x2="972" y2="772" stroke="#16A34A" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="1084" y="763" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#166534">200 Task</text><line x1="954" y1="816" x2="474" y2="816" stroke="#16A34A" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="711" y="807" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#166534">updated</text><line x1="468" y1="861" x2="699" y2="861" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arrow)"/><text x="586" y="852" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#166534">dispatch &apos;task-updated&apos;</text><line x1="705" y1="905" x2="226" y2="905" stroke="#16A34A" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="462" y="896" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#166534">row re-renders with the Completed badge</text><path d="M462 941 h44 v18 h-44" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow)"/><text x="518" y="956" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#166534">showFlash(&apos;… marked complete.&apos;)</text><text x="80" y="1024" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#475569">There is no reopen endpoint and PATCH cannot set completed, so the Complete button simply disappears once the task is done. Under ?status=active the</text><text x="80" y="1048" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#475569">row stays visible until the next reload — it is updated in place, not filtered out.</text></svg>
