<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L10,5 z" fill="context-stroke"/></marker><marker id="arrow-open" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs><rect width="100%" height="100%" fill="#F8FAFC"/><text x="80" y="78" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#172033">Editing a task — PATCH is a full replacement</text><text x="80" y="118" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#475569">Including the 404 path when the row disappeared underneath</text><rect x="70" y="612" width="1780" height="188" rx="12" fill="#DCFCE7" fill-opacity="0.40" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="7 5"/><text x="84" y="633" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#166534">alt  [row exists]</text><rect x="70" y="790" width="1780" height="188" rx="12" fill="#FEE2E2" fill-opacity="0.40" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="7 5"/><text x="84" y="811" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#991B1B">alt  [row is gone]</text><line x1="214" y1="248" x2="214" y2="1000" stroke="#4F46E5" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="103" y="172" width="222" height="76" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="214" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#312E81">TaskEditPage.tsx</text><line x1="462" y1="248" x2="462" y2="1000" stroke="#4F46E5" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="351" y="172" width="222" height="76" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="462" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#312E81">api/tasks.ts</text><line x1="711" y1="248" x2="711" y2="1000" stroke="#0D9488" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="600" y="172" width="222" height="76" rx="12" fill="#CCFBF1" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/><text x="711" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#115E59">routes/tasks.py</text><line x1="960" y1="248" x2="960" y2="1000" stroke="#7C3AED" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="849" y="172" width="222" height="76" rx="12" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/><text x="960" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#5B21B6">task_service.py</text><line x1="1208" y1="248" x2="1208" y2="1000" stroke="#B45309" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="1097" y="172" width="222" height="76" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2" filter="url(#shadow)"/><text x="1208" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#92400E">task_repository.py</text><line x1="1457" y1="248" x2="1457" y2="1000" stroke="#0D9488" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="1346" y="172" width="222" height="76" rx="12" fill="#CCFBF1" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/><text x="1457" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#115E59">core/errors.py</text><line x1="1705" y1="248" x2="1705" y2="1000" stroke="#B45309" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="1594" y="172" width="222" height="76" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2" filter="url(#shadow)"/><text x="1705" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#92400E">minitrack.db</text><line x1="220" y1="300" x2="450" y2="300" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="338" y="291" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E293B">getTask(id) — pre-fill the form</text><line x1="456" y1="338" x2="226" y2="338" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="338" y="329" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">Task → fromTask(task)</text><line x1="220" y1="376" x2="450" y2="376" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="338" y="367" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">replaceTask(id, input)</text><text x="338" y="393" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">all three fields always sent</text><line x1="468" y1="428" x2="699" y2="428" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="586" y="419" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">PATCH /tasks/{id}</text><text x="586" y="445" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">binds the same TaskIn model as POST</text><line x1="717" y1="480" x2="948" y2="480" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="836" y="471" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">replace_task(task_id, data)</text><line x1="966" y1="518" x2="1196" y2="518" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1084" y="509" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">update_task(task_id, …)</text><line x1="1214" y1="556" x2="1693" y2="556" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1456" y="547" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">① SELECT — does the row exist?</text><line x1="1699" y1="594" x2="1220" y2="594" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="1456" y="585" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">row or None</text><line x1="1214" y1="658" x2="1693" y2="658" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1456" y="649" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#166534">② UPDATE title, description, priority</text><line x1="1214" y1="696" x2="1693" y2="696" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1456" y="687" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#166534">③ SELECT — re-fetch the fresh row</text><line x1="1202" y1="734" x2="972" y2="734" stroke="#16A34A" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="1084" y="725" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#166534">dict</text><line x1="705" y1="772" x2="226" y2="772" stroke="#16A34A" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="462" y="763" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#166534">200 Task → &apos;Task updated.&apos;</text><line x1="1202" y1="836" x2="972" y2="836" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="1084" y="827" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#991B1B">None</text><path d="M960 865 h44 v18 h-44" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow)"/><text x="1016" y="880" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#991B1B">raise TaskNotFound(task_id)</text><line x1="1451" y1="912" x2="226" y2="912" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="836" y="903" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#991B1B">404 { detail, request_id }</text><path d="M214 941 h44 v18 h-44" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow)"/><text x="270" y="956" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#991B1B">isNotFound → render the not-found state</text><text x="80" y="1024" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#475569">Omitting a field does not leave it alone: description omitted writes NULL, priority omitted resets to &apos;medium&apos;. That is why the client wrapper is</text><text x="80" y="1048" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#475569">named replaceTask, and why completed cannot be changed here at all.</text></svg>
