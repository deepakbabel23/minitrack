<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L10,5 z" fill="context-stroke"/></marker><marker id="arrow-open" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs><rect width="100%" height="100%" fill="#F8FAFC"/><text x="80" y="78" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#172033">A mid-session 401 tears the session down</text><text x="80" y="118" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#475569">The two-tier rule: stored key vs explicitly supplied candidate</text><rect x="70" y="254" width="1780" height="543" rx="12" fill="#FEE2E2" fill-opacity="0.40" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="7 5"/><text x="84" y="275" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#991B1B">alt  [stored key rejected — tier 1]</text><rect x="70" y="792" width="1780" height="159" rx="12" fill="#DCFCE7" fill-opacity="0.40" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="7 5"/><text x="84" y="813" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#166534">alt  [candidate key rejected — tier 2]</text><line x1="214" y1="248" x2="214" y2="973" stroke="#7C3AED" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="103" y="172" width="222" height="76" rx="12" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/><text x="214" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#5B21B6">useTaskList.ts</text><line x1="462" y1="248" x2="462" y2="973" stroke="#4F46E5" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="351" y="172" width="222" height="76" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="462" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#312E81">api/client.ts</text><line x1="711" y1="248" x2="711" y2="973" stroke="#0D9488" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="600" y="172" width="222" height="76" rx="12" fill="#CCFBF1" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/><text x="711" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#115E59">core/security.py</text><line x1="960" y1="248" x2="960" y2="973" stroke="#4F46E5" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="849" y="172" width="222" height="76" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="960" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#312E81">src/main.tsx</text><line x1="1208" y1="248" x2="1208" y2="973" stroke="#16A34A" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="1097" y="172" width="222" height="76" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2" filter="url(#shadow)"/><text x="1208" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#166534">auth/apiKeyStore.ts</text><line x1="1457" y1="248" x2="1457" y2="973" stroke="#16A34A" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="1346" y="172" width="222" height="76" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2" filter="url(#shadow)"/><text x="1457" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#166534">ProtectedRoute.tsx</text><line x1="1705" y1="248" x2="1705" y2="973" stroke="#4F46E5" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="1594" y="172" width="222" height="76" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="1705" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#312E81">ConnectPage.tsx</text><line x1="220" y1="300" x2="450" y2="300" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="338" y="291" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">listTasks(…) — no explicit key</text><path d="M462 333 h44 v18 h-44" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/><text x="518" y="348" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E293B">usedExplicitKey = false; key from apiKeyProvider()</text><line x1="468" y1="385" x2="699" y2="385" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="586" y="376" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">GET /tasks + X-API-Key</text><line x1="705" y1="428" x2="474" y2="428" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="586" y="419" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#991B1B">401 — key no longer valid</text><path d="M462 461 h44 v18 h-44" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow)"/><text x="518" y="476" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#991B1B">401 and NOT usedExplicitKey → fire the handler</text><line x1="468" y1="513" x2="948" y2="513" stroke="#DC2626" stroke-width="2.2" marker-end="url(#arrow)"/><text x="711" y="504" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#991B1B">unauthorizedHandler(error)</text><line x1="966" y1="556" x2="1196" y2="556" stroke="#DC2626" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1084" y="547" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#991B1B">disconnect(&apos;Your API key was rejected — please reconnect.&apos;)</text><path d="M1208 589 h44 v18 h-44" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow)"/><text x="1264" y="604" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#991B1B">sessionStorage.removeItem · snapshot.apiKey = null</text><line x1="1214" y1="641" x2="1445" y2="641" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="1332" y="632" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#991B1B">useSyncExternalStore notifies → isConnected = false</text><line x1="1463" y1="684" x2="1693" y2="684" stroke="#DC2626" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1581" y="675" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#991B1B">Navigate to /connect, state.from = current path</text><path d="M1705 718 h44 v18 h-44" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow)"/><text x="1761" y="733" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#991B1B">render the disconnectReason banner</text><line x1="456" y1="769" x2="226" y2="769" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="338" y="760" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E293B">throw ApiClientError — caller still sees it</text><line x1="468" y1="838" x2="699" y2="838" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="586" y="829" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E293B">GET /tasks?limit=1 with an explicit candidate</text><line x1="705" y1="881" x2="474" y2="881" stroke="#16A34A" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="586" y="872" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#166534">401</text><path d="M462 914 h44 v18 h-44" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow)"/><text x="518" y="929" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#166534">usedExplicitKey → handler skipped, session survives</text><text x="80" y="1024" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#475569">Both tiers are decided by one condition in api/client.ts: status === 401 &amp;&amp; !usedExplicitKey. Only the stored-key case disconnects; a rejected</text><text x="80" y="1048" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#475569">candidate on /connect must never log the user out.</text></svg>
