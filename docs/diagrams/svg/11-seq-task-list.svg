rial, sans-serif" font-size="14" font-weight="600" fill="#1E293B">SELECT … ORDER BY id LIMIT ? OFFSET ?</text><line x1="1699" y1="591" x2="1469" y2="591" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="1581" y="582" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">sqlite3.Row rows</text><line x1="1451" y1="632" x2="1220" y2="632" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="1332" y="623" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">[dict] — completed int → bool</text><line x1="1202" y1="674" x2="972" y2="674" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="1084" y="665" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">[dict]</text><line x1="954" y1="716" x2="723" y2="716" stroke="#16A34A" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="836" y="707" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#166534">200 [Task]</text><line x1="705" y1="757" x2="474" y2="757" stroke="#16A34A" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="586" y="748" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#166534">Task[]</text><path d="M462 790 h44 v18 h-44" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/><text x="518" y="805" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E293B">stale seq? drop · else &apos;load-success&apos;</text><line x1="456" y1="840" x2="226" y2="840" stroke="#16A34A" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="338" y="831" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#166534">dedupe by id · render TaskCard × N</text><line x1="220" y1="908" x2="450" y2="908" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="338" y="899" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">loadMore() → offset 20</text><path d="M462 941 h44 v18 h-44" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow)"/><text x="518" y="956" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#166534">hasMore = page.length === PAGE_SIZE</text><text x="80" y="1024" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#475569">GET /tasks returns a bare array with no total, so a short page is the only end-of-list signal, and nextOffset is a counter rather than tasks.length —</text><text x="80" y="1048" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#475569">a delete must not cause an already-seen row to be re-fetched.</text></svg>
