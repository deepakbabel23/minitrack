<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L10,5 z" fill="context-stroke"/></marker><marker id="arrow-open" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs><rect width="100%" height="100%" fill="#F8FAFC"/><text x="80" y="78" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#172033">A validation failure becomes a single string</text><text x="80" y="118" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#475569">Pydantic errors are joined, not passed through as FastAPI&apos;s array</text><line x1="214" y1="248" x2="214" y2="1000" stroke="#4F46E5" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="103" y="172" width="222" height="76" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="214" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#312E81">TaskForm.tsx</text><line x1="462" y1="248" x2="462" y2="1000" stroke="#4F46E5" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="351" y="172" width="222" height="76" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="462" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#312E81">api/client.ts</text><line x1="711" y1="248" x2="711" y2="1000" stroke="#0D9488" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="600" y="172" width="222" height="76" rx="12" fill="#CCFBF1" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/><text x="711" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#115E59">core/security.py</text><line x1="960" y1="248" x2="960" y2="1000" stroke="#0D9488" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="849" y="172" width="222" height="76" rx="12" fill="#CCFBF1" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/><text x="960" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#115E59">routes/tasks.py</text><line x1="1208" y1="248" x2="1208" y2="1000" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="1097" y="172" width="222" height="76" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" filter="url(#shadow)"/><text x="1208" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1E293B">schemas/task.py</text><line x1="1457" y1="248" x2="1457" y2="1000" stroke="#0D9488" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="1346" y="172" width="222" height="76" rx="12" fill="#CCFBF1" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/><text x="1457" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#115E59">core/errors.py</text><line x1="1705" y1="248" x2="1705" y2="1000" stroke="#4F46E5" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="1594" y="172" width="222" height="76" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="1705" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#312E81">api/errors.ts</text><line x1="220" y1="300" x2="450" y2="300" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="338" y="291" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E293B">createTask({ title: &apos;   &apos;, priority: &apos;urgent&apos; })</text><line x1="468" y1="350" x2="699" y2="350" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="586" y="341" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">POST /tasks</text><path d="M711 391 h44 v18 h-44" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/><text x="767" y="406" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E293B">require_api_key resolves FIRST</text><line x1="717" y1="450" x2="948" y2="450" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="836" y="441" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E293B">key ok → continue to body validation</text><line x1="966" y1="500" x2="1196" y2="500" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1084" y="491" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">TaskIn(**body)</text><path d="M1208 541 h44 v18 h-44" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow)"/><text x="1264" y="556" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#991B1B">title min_length=1 fails · Priority enum fails</text><line x1="1202" y1="600" x2="972" y2="600" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="1084" y="591" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#991B1B">raise RequestValidationError</text><line x1="966" y1="650" x2="1445" y2="650" stroke="#DC2626" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1208" y="641" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#991B1B">handled by _validation_error</text><path d="M1457 691 h44 v18 h-44" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow)"/><text x="1513" y="706" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#991B1B">&apos;; &apos;.join(f&quot;{loc}: {msg}&quot;) — one flat string</text><path d="M1457 741 h44 v18 h-44" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow)"/><text x="1513" y="756" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#991B1B">ErrorResponse(detail, request_id=get_request_id())</text><line x1="1451" y1="800" x2="474" y2="800" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="960" y="791" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#991B1B">422 { detail: &apos;…&apos;, request_id: &apos;…&apos; }</text><path d="M462 841 h44 v18 h-44" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/><text x="518" y="856" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E293B">read the body with .text(), never .json()</text><line x1="468" y1="900" x2="1693" y2="900" stroke="#DC2626" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1084" y="891" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#991B1B">new ApiClientError({ status: 422, detail })</text><line x1="1699" y1="950" x2="226" y2="950" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="960" y="941" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#991B1B">detail used verbatim in the error banner</text><text x="80" y="1024" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#475569">A 422 detail is a plain string, not FastAPI&apos;s array of { loc, msg, type }. Only read detail when it is a string. A 401 body carries no request_id, and</text><text x="80" y="1048" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#475569">an unhandled 500 is text/plain — which is why error bodies are always read with .text().</text></svg>
