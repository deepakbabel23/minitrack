<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L10,5 z" fill="context-stroke"/></marker><marker id="arrow-open" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs><rect width="100%" height="100%" fill="#F8FAFC"/><text x="80" y="78" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#172033">Backend components — backend/app/</text><text x="80" y="118" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#475569">Each layer imports only downward; core/ and schemas/ are cross-cutting leaves</text><rect x="95" y="270" width="385" height="640" rx="18" fill="#F1F5F9" fill-opacity="0.35" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="8 6"/><text x="113" y="299" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#1E293B">Cross-cutting — app/core/ + app/schemas/</text><rect x="560" y="275" width="800" height="230" rx="18" fill="#CCFBF1" fill-opacity="0.35" stroke="#0D9488" stroke-width="1.8" stroke-dasharray="8 6"/><text x="578" y="304" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#115E59">HTTP edge — app/api/</text><rect x="560" y="540" width="800" height="135" rx="18" fill="#F3E8FF" fill-opacity="0.35" stroke="#7C3AED" stroke-width="1.8" stroke-dasharray="8 6"/><text x="578" y="569" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#5B21B6">Business logic — app/services/</text><rect x="560" y="710" width="800" height="200" rx="18" fill="#FEF3C7" fill-opacity="0.35" stroke="#B45309" stroke-width="1.8" stroke-dasharray="8 6"/><text x="578" y="739" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#92400E">Persistence — app/data/</text><line x1="756" y1="205" x2="950" y2="365" stroke="#0D9488" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="1164" y1="205" x2="960" y2="365" stroke="#0D9488" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="966" y1="365" x2="1335" y2="455" stroke="#0D9488" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><line x1="960" y1="489" x2="960" y2="565" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="960" y1="659" x2="768" y2="740" stroke="#B45309" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="944" y1="790" x2="960" y2="790" stroke="#B45309" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="1329" y1="790" x2="1440" y2="800" stroke="#B45309" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="1600" y1="369" x2="1600" y2="405" stroke="#DC2626" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="1446" y1="460" x2="1335" y2="790" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><line x1="459" y1="601" x2="960" y2="365" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><line x1="290" y1="722" x2="290" y2="720" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><rect x="760" y="165" width="400" height="80" rx="14" fill="#CCFBF1" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/><text x="960" y="196" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#115E59">app/main.py</text><text x="960" y="220" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">create_app() · lifespan · middleware</text><rect x="595" y="325" width="345" height="80" rx="14" fill="#CCFBF1" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/><text x="768" y="356" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#115E59">api/routes/health.py</text><text x="768" y="380" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">GET /health · public</text><rect x="970" y="325" width="355" height="80" rx="14" fill="#CCFBF1" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/><text x="1148" y="356" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#115E59">api/routes/tasks.py</text><text x="1148" y="380" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">6 × /tasks · X-API-Key</text><rect x="595" y="425" width="730" height="60" rx="14" fill="#CCFBF1" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/><text x="960" y="446" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#115E59">app/api/deps.py</text><text x="960" y="470" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">get_task_service → get_repository → get_settings</text><rect x="595" y="575" width="730" height="80" rx="14" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/><text x="960" y="606" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#5B21B6">app/services/task_service.py</text><text x="960" y="630" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">list · get · create · replace · complete · delete</text><rect x="595" y="750" width="345" height="80" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2" filter="url(#shadow)"/><text x="768" y="781" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#92400E">app/data/task_repository.py</text><text x="768" y="805" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">the only task SQL</text><rect x="970" y="750" width="355" height="80" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2" filter="url(#shadow)"/><text x="1148" y="781" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#92400E">app/data/database.py</text><text x="1148" y="805" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">the only sqlite3.connect()</text><rect x="1450" y="755" width="300" height="90" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2" filter="url(#shadow)"/><text x="1600" y="791" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#92400E">backend/minitrack.db</text><text x="1600" y="815" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">5 columns · 0 indexes</text><rect x="125" y="320" width="330" height="70" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" filter="url(#shadow)"/><text x="290" y="346" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E293B">core/config.py</text><text x="290" y="370" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">Settings · @lru_cache</text><rect x="125" y="402" width="330" height="70" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" filter="url(#shadow)"/><text x="290" y="428" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E293B">core/logging.py</text><text x="290" y="452" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">request-id ContextVar</text><rect x="125" y="484" width="330" height="70" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" filter="url(#shadow)"/><text x="290" y="510" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E293B">core/middleware.py</text><text x="290" y="534" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">RequestContextMiddleware</text><rect x="125" y="566" width="330" height="70" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" filter="url(#shadow)"/><text x="290" y="592" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E293B">core/security.py</text><text x="290" y="616" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">X-API-Key · hmac.compare_digest</text><rect x="125" y="648" width="330" height="70" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" filter="url(#shadow)"/><text x="290" y="674" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E293B">core/errors.py</text><text x="290" y="698" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">TaskNotFound → 404 · 422 join</text><rect x="125" y="730" width="330" height="70" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" filter="url(#shadow)"/><text x="290" y="756" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E293B">core/exceptions.py</text><text x="290" y="780" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">DomainError · TaskNotFound</text><rect x="125" y="812" width="330" height="70" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" filter="url(#shadow)"/><text x="290" y="838" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E293B">app/schemas/</text><text x="290" y="862" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">TaskIn · Task · ErrorResponse</text><rect x="1450" y="290" width="300" height="75" rx="14" fill="#F1F5F9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/><text x="1600" y="318" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E293B">seed_data.py</text><text x="1600" y="342" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">+ tests/test_seed_data.py</text><rect x="1450" y="415" width="300" height="90" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" filter="url(#shadow)"/><text x="1600" y="451" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#991B1B">app/db.py</text><text x="1600" y="475" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">DEPRECATED compatibility facade</text><rect x="1400" y="545" width="400" height="160" rx="10" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1414" y="573" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#5B21B6">app/services/ never imports fastapi. It raises</text><text x="1414" y="594" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#5B21B6">TaskNotFound from app/core/exceptions.py, and</text><text x="1414" y="615" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#5B21B6">app/core/errors.py is the single place that turns</text><text x="1414" y="636" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#5B21B6">a domain exception into an HTTP status.</text><rect x="1400" y="875" width="400" height="130" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1414" y="903" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#991B1B">app/db.py is kept only so seed_data.py and the</text><text x="1414" y="924" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#991B1B">legacy tests/test_seed_data.py keep working. It is</text><text x="1414" y="945" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#991B1B">on no HTTP request path. Never build a new feature</text><text x="1414" y="966" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#991B1B">on it.</text><text x="80" y="1024" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#475569">Reading the diagram: solid arrows are imports/calls, dashed are wiring and cross-cutting use. Nothing in services/ or data/ points back up into api/.</text></svg>
