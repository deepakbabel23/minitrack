<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L10,5 z" fill="context-stroke"/></marker><marker id="arrow-open" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs><rect width="100%" height="100%" fill="#F8FAFC"/><text x="80" y="78" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#172033">Creating a task</text><text x="80" y="118" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#475569">POST /tasks → 201 → redirect carrying a one-shot flash message</text><line x1="214" y1="248" x2="214" y2="986" stroke="#4F46E5" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="103" y="172" width="222" height="76" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="214" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#312E81">TaskForm.tsx</text><line x1="462" y1="248" x2="462" y2="986" stroke="#4F46E5" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="351" y="172" width="222" height="76" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="462" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#312E81">TaskCreatePage.tsx</text><line x1="711" y1="248" x2="711" y2="986" stroke="#4F46E5" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="600" y="172" width="222" height="76" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="711" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#312E81">api/tasks.ts</text><line x1="960" y1="248" x2="960" y2="986" stroke="#0D9488" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="849" y="172" width="222" height="76" rx="12" fill="#CCFBF1" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/><text x="960" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#115E59">routes/tasks.py</text><line x1="1208" y1="248" x2="1208" y2="986" stroke="#7C3AED" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="1097" y="172" width="222" height="76" rx="12" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/><text x="1208" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#5B21B6">task_service.py</text><line x1="1457" y1="248" x2="1457" y2="986" stroke="#B45309" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="1346" y="172" width="222" height="76" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2" filter="url(#shadow)"/><text x="1457" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#92400E">task_repository.py</text><line x1="1705" y1="248" x2="1705" y2="986" stroke="#B45309" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="1594" y="172" width="222" height="76" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2" filter="url(#shadow)"/><text x="1705" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#92400E">minitrack.db</text><path d="M214 291 h44 v18 h-44" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/><text x="270" y="306" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E293B">blank title? error, never hits the network</text><line x1="220" y1="341" x2="450" y2="341" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="338" y="332" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">onSubmit(toTaskInput(values))</text><text x="338" y="358" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">empty description becomes null, not &apos;&apos;</text><path d="M462 387 h44 v18 h-44" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/><text x="518" y="402" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E293B">inFlight guard against double submit</text><line x1="468" y1="438" x2="699" y2="438" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="586" y="429" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">createTask(input)</text><line x1="717" y1="479" x2="948" y2="479" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="836" y="470" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">POST /tasks</text><path d="M960 512 h44 v18 h-44" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/><text x="1016" y="527" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E293B">require_api_key resolves before the body</text><path d="M960 553 h44 v18 h-44" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/><text x="1016" y="568" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E293B">TaskIn — title min_length=1, Priority enum</text><line x1="966" y1="604" x2="1196" y2="604" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1084" y="595" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">create_task(payload)</text><line x1="1214" y1="645" x2="1445" y2="645" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1332" y="636" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E293B">create_task(title, description, priority)</text><line x1="1463" y1="687" x2="1693" y2="687" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1581" y="678" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">① INSERT INTO tasks (…)</text><line x1="1699" y1="728" x2="1469" y2="728" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="1581" y="719" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">lastrowid</text><line x1="1463" y1="770" x2="1693" y2="770" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1581" y="761" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E293B">② SELECT * FROM tasks WHERE id = ? — the re-fetch</text><line x1="1699" y1="811" x2="1469" y2="811" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="1581" y="802" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">fresh row</text><line x1="1451" y1="853" x2="1220" y2="853" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="1332" y="844" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">dict</text><line x1="954" y1="894" x2="723" y2="894" stroke="#16A34A" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="836" y="885" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#166534">201 Task</text><line x1="456" y1="936" x2="226" y2="936" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arrow)"/><text x="338" y="927" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#166534">navigate to /tasks/{id} with state.flash</text><text x="338" y="953" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">useRouterFlash consumes it exactly once</text><text x="80" y="1024" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#475569">TaskRepository.create_task opens two separate connections — insert, then re-fetch — so the operation is not atomic end to end. Accepted for a</text><text x="80" y="1048" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#475569">single-user lab (ARCHITECTURE.md §6).</text></svg>
