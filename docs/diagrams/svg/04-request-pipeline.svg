<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L10,5 z" fill="context-stroke"/></marker><marker id="arrow-open" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs><rect width="100%" height="100%" fill="#F8FAFC"/><text x="80" y="78" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#172033">Request pipeline — the composed ASGI stack</text><text x="80" y="118" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#475569">Outermost to innermost, as Starlette builds it on the first request</text><line x1="910" y1="234" x2="910" y2="248" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="910" y1="340" x2="910" y2="354" stroke="#0D9488" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="910" y1="446" x2="910" y2="460" stroke="#0D9488" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="910" y1="552" x2="910" y2="566" stroke="#0D9488" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="910" y1="658" x2="910" y2="672" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="910" y1="764" x2="910" y2="778" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="700" y="160" width="420" height="70" rx="14" fill="#F1F5F9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/><text x="910" y="195" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E293B">Incoming request</text><rect x="640" y="258" width="540" height="78" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" filter="url(#shadow)"/><text x="910" y="288" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E293B">ServerErrorMiddleware</text><text x="910" y="312" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">no handler registered → 500 as text/plain</text><rect x="640" y="364" width="540" height="78" rx="14" fill="#CCFBF1" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/><text x="910" y="394" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#115E59">CORSMiddleware</text><text x="910" y="418" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">installed only when MINITRACK_CORS_ORIGINS is non-empty</text><rect x="640" y="470" width="540" height="78" rx="14" fill="#CCFBF1" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/><text x="910" y="500" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#115E59">RequestContextMiddleware</text><text x="910" y="524" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">uuid4 → X-Request-ID header + app.access log</text><rect x="640" y="576" width="540" height="78" rx="14" fill="#CCFBF1" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/><text x="910" y="606" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#115E59">ExceptionMiddleware</text><text x="910" y="630" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">TaskNotFound → 404 · RequestValidationError → 422</text><rect x="640" y="682" width="540" height="78" rx="14" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/><text x="910" y="712" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#5B21B6">APIRoute</text><text x="910" y="736" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">solve_dependencies → require_api_key resolves first</text><rect x="640" y="788" width="540" height="78" rx="14" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/><text x="910" y="818" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#5B21B6">endpoint function</text><text x="910" y="842" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">run_in_threadpool — every route is def, not async def</text><rect x="105" y="258" width="470" height="145" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="119" y="286" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#1E293B">add_middleware inserts at index 0, so the LAST registered</text><text x="119" y="307" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#1E293B">middleware ends up OUTERMOST. create_app() registers</text><text x="119" y="328" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#1E293B">RequestContextMiddleware first, then CORSMiddleware.</text><rect x="105" y="430" width="470" height="145" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5" stroke-dasharray="6 4"/><text x="119" y="458" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#115E59">An OPTIONS preflight is answered by CORSMiddleware and</text><text x="119" y="479" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#115E59">never reaches RequestContextMiddleware — so preflights get</text><text x="119" y="500" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#115E59">no X-Request-ID and no access-log line.</text><rect x="1245" y="560" width="470" height="145" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1259" y="588" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#115E59">ExceptionMiddleware sits INSIDE RequestContextMiddleware,</text><text x="1259" y="609" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#115E59">which is why get_request_id() still resolves when</text><text x="1259" y="630" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#115E59">_error_response builds a 404 or 422 body.</text><rect x="1245" y="730" width="470" height="125" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1259" y="758" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#991B1B">require_api_key resolves before body validation. A bad key</text><text x="1259" y="779" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#991B1B">plus a bad body therefore returns 401 — never 422.</text><text x="80" y="1024" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#475569">Reading the diagram: a request travels down the stack and the response travels back up, picking up X-Request-ID and CORS headers on the way out.</text></svg>
