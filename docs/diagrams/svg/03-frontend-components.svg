 height="140" rx="18" fill="#CCFBF1" fill-opacity="0.35" stroke="#0D9488" stroke-width="1.8" stroke-dasharray="8 6"/><text x="538" y="669" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#115E59">src/api/  ·  no React imports</text><rect x="1365" y="640" width="465" height="200" rx="18" fill="#DCFCE7" fill-opacity="0.35" stroke="#16A34A" stroke-width="1.8" stroke-dasharray="8 6"/><text x="1383" y="669" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#166534">src/auth/</text><line x1="920" y1="249" x2="920" y2="275" stroke="#4F46E5" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="920" y1="364" x2="930" y2="435" stroke="#4F46E5" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="806" y1="478" x2="455" y2="548" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="285" y1="584" x2="925" y2="675" stroke="#0D9488" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="808" y1="722" x2="805" y2="722" stroke="#0D9488" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="541" y1="722" x2="455" y2="725" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="799" y1="722" x2="1045" y2="722" stroke="#0D9488" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><line x1="1144" y1="205" x2="1380" y2="720" stroke="#16A34A" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><line x1="1488" y1="764" x2="1598" y2="765" stroke="#16A34A" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><line x1="1603" y1="797" x2="1597" y2="797" stroke="#16A34A" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><line x1="925" y1="764" x2="920" y2="845" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><rect x="700" y="165" width="440" height="80" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="920" y="196" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#312E81">src/main.tsx</text><text x="920" y="220" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">hydrate → register → createRoot</text><rect x="700" y="285" width="440" height="75" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="920" y="314" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#312E81">src/App.tsx</text><text x="920" y="338" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">the route table</text><rect x="125" y="442" width="152" height="60" rx="14" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/><text x="201" y="472" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#5B21B6">useFlash</text><rect x="292" y="442" width="153" height="60" rx="14" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/><text x="368" y="472" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#5B21B6">useStatusFilter</text><rect x="125" y="515" width="320" height="65" rx="14" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/><text x="285" y="538" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#5B21B6">useTaskList</text><text x="285" y="562" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">6 reducer actions</text><rect x="550" y="445" width="240" height="65" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="670" y="478" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#312E81">ConnectPage</text><rect x="810" y="445" width="240" height="65" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="930" y="478" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#312E81">TaskListPage</text><rect x="1070" y="445" width="230" height="65" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="1185" y="478" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#312E81">TaskDetailPage</text><rect x="550" y="522" width="240" height="58" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="670" y="551" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#312E81">TaskCreatePage</text><rect x="810" y="522" width="240" height="58" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="930" y="551" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#312E81">TaskEditPage</text><rect x="1070" y="522" width="230" height="58" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="1185" y="551" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#312E81">NotFoundPage</text><rect x="1390" y="445" width="200" height="65" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="1490" y="478" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#312E81">TaskForm</text><rect x="1610" y="445" width="195" height="65" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="1708" y="478" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#312E81">TaskCard</text><rect x="1390" y="522" width="200" height="58" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="1490" y="551" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#312E81">ConfirmDialog</text><rect x="1610" y="522" width="195" height="58" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="1708" y="551" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#312E81">Badges · Flash</text><rect x="545" y="685" width="250" height="75" rx="14" fill="#CCFBF1" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/><text x="670" y="714" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#115E59">api/client.ts</text><text x="670" y="738" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">the only fetch()</text><rect x="812" y="685" width="226" height="75" rx="14" fill="#CCFBF1" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/><text x="925" y="714" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#115E59">api/tasks.ts</text><text x="925" y="738" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">6 endpoint wrappers</text><rect x="1055" y="685" width="245" height="75" rx="14" fill="#CCFBF1" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/><text x="1178" y="714" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#115E59">api/errors.ts</text><text x="1178" y="738" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">ApiClientError</text><rect x="1390" y="685" width="415" height="70" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="2" filter="url(#shadow)"/><text x="1598" y="711" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#166534">auth/apiKeyStore.ts</text><text x="1598" y="735" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">observable store · no React</text><rect x="1390" y="768" width="197" height="58" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="2" filter="url(#shadow)"/><text x="1488" y="788" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#166534">ApiKeyContext</text><text x="1488" y="812" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">useSyncExternalStore</text><rect x="1607" y="768" width="198" height="58" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="2" filter="url(#shadow)"/><text x="1706" y="797" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#166534">ProtectedRoute</text><rect x="700" y="855" width="440" height="70" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" filter="url(#shadow)"/><text x="920" y="881" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E293B">src/types/index.ts</text><text x="920" y="905" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">Task · TaskInput · Priority</text><rect x="95" y="680" width="350" height="90" rx="14" fill="#F1F5F9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/><text x="270" y="716" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E293B">FastAPI backend</text><text x="270" y="740" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">VITE_API_BASE_URL</text><rect x="95" y="810" width="350" height="175" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="6 4"/><text x="109" y="838" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#166534">The inversion that keeps src/api/</text><text x="109" y="859" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#166534">React-free: client.ts never imports</text><text x="109" y="880" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#166534">apiKeyStore. main.tsx registers a getter</text><text x="109" y="901" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#166534">with setApiKeyProvider, and client.ts pulls</text><text x="109" y="922" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#166534">the key per request. A pushed key would</text><text x="109" y="943" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#166534">lose the effect-ordering race and 401 on</text><text x="109" y="964" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#166534">first load.</text><text x="80" y="1024" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#475569">Reading the diagram: arrows point the way imports go. Nothing under src/api/ imports React, and nothing under src/components/ fetches.</text></svg>
