<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L10,5 z" fill="context-stroke"/></marker><marker id="arrow-open" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs><rect width="100%" height="100%" fill="#F8FAFC"/><text x="80" y="78" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#172033">Deleting a task — confirm, 204, and focus restore</text><text x="80" y="118" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#475569">204 returns before any body read; focus is moved before the row unmounts</text><rect x="70" y="650" width="1780" height="226" rx="12" fill="#DCFCE7" fill-opacity="0.40" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="7 5"/><text x="84" y="671" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#166534">alt  [row still existed]</text><rect x="70" y="866" width="1780" height="112" rx="12" fill="#FEE2E2" fill-opacity="0.40" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="7 5"/><text x="84" y="887" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#991B1B">alt  [row was already gone]</text><line x1="214" y1="248" x2="214" y2="1000" stroke="#4F46E5" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="103" y="172" width="222" height="76" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="214" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#312E81">TaskListPage.tsx</text><line x1="462" y1="248" x2="462" y2="1000" stroke="#4F46E5" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="351" y="172" width="222" height="76" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="462" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#312E81">ConfirmDialog.tsx</text><line x1="711" y1="248" x2="711" y2="1000" stroke="#4F46E5" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="600" y="172" width="222" height="76" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="711" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#312E81">api/tasks.ts</text><line x1="960" y1="248" x2="960" y2="1000" stroke="#4F46E5" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="849" y="172" width="222" height="76" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/><text x="960" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#312E81">api/client.ts</text><line x1="1208" y1="248" x2="1208" y2="1000" stroke="#0D9488" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="1097" y="172" width="222" height="76" rx="12" fill="#CCFBF1" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/><text x="1208" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#115E59">routes/tasks.py</text><line x1="1457" y1="248" x2="1457" y2="1000" stroke="#7C3AED" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="1346" y="172" width="222" height="76" rx="12" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/><text x="1457" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#5B21B6">task_service.py</text><line x1="1705" y1="248" x2="1705" y2="1000" stroke="#B45309" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity="0.55"/><rect x="1594" y="172" width="222" height="76" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2" filter="url(#shadow)"/><text x="1705" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#92400E">task_repository.py</text><line x1="220" y1="300" x2="450" y2="300" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="338" y="291" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">setPendingDelete(task) → open</text><path d="M462 329 h44 v18 h-44" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/><text x="518" y="344" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E293B">native &lt;dialog&gt;.showModal()</text><line x1="456" y1="390" x2="226" y2="390" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="338" y="381" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">onConfirm</text><line x1="220" y1="428" x2="699" y2="428" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="462" y="419" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">deleteTask(id)</text><line x1="717" y1="466" x2="948" y2="466" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="836" y="457" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E293B">requestVoid(path, { method: &apos;DELETE&apos; })</text><line x1="966" y1="504" x2="1196" y2="504" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1084" y="495" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">DELETE /tasks/{id}</text><line x1="1214" y1="542" x2="1445" y2="542" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1332" y="533" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">delete_task(task_id)</text><line x1="1463" y1="580" x2="1693" y2="580" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1581" y="571" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#1E293B">delete_task(task_id)</text><path d="M1705 609 h44 v18 h-44" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/><text x="1761" y="624" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E293B">check exists → DELETE FROM tasks</text><line x1="1699" y1="696" x2="1469" y2="696" stroke="#16A34A" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="1581" y="687" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#166534">True</text><line x1="1202" y1="734" x2="972" y2="734" stroke="#16A34A" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="1084" y="725" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#166534">204 No Content</text><path d="M960 763 h44 v18 h-44" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow)"/><text x="1016" y="778" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#166534">204 → return null before reading a body</text><line x1="954" y1="810" x2="226" y2="810" stroke="#16A34A" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="587" y="801" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#166534">resolves void</text><path d="M214 839 h44 v18 h-44" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow)"/><text x="270" y="854" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#166534">&apos;task-removed&apos; · showFlash · setRestoreFocus</text><line x1="1202" y1="912" x2="972" y2="912" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-open)"/><text x="1084" y="903" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#991B1B">404 — already deleted</text><path d="M214 941 h44 v18 h-44" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow)"/><text x="270" y="956" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#991B1B">isNotFound → remove the row anyway</text><text x="80" y="1024" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#475569">The two-phase focus restore exists because &lt;dialog&gt;.close() returns focus to the button that opened it — a Delete button on a row that has just</text><text x="80" y="1048" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#475569">unmounted. Focus is moved to the list heading instead.</text></svg>
