name: Verify

# One job per module: backend (pytest), frontend (vitest), e2e (playwright).
#
# No secrets are needed. backend/.env.example ships working values for the two
# settings that matter -- MINITRACK_API_KEYS and MINITRACK_CORS_ORIGINS -- and
# CODE_REVIEW.md records that key as a known public lab value, so CI does what a
# developer does locally: cp .env.example .env.
#
# The Playwright *agents* deliberately do not run here. The Healer has write
# tools and a mandate to make tests pass without asking; healing is a local,
# reviewed activity. This workflow only runs `playwright test`.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  backend:
    name: backend · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r requirements.txt

      # conftest.py sets MINITRACK_DB_PATH and MINITRACK_API_KEYS per test, so
      # the suite needs no .env of its own.
      - name: Run tests
        working-directory: backend
        run: .venv/bin/pytest -q

  frontend:
    name: frontend · vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run typecheck
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend

      - run: npm test
        working-directory: frontend

  e2e:
    name: e2e · playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      # playwright.config.ts webServer boots BOTH halves itself, so this job
      # needs Python and both npm projects installed even though it only runs
      # `playwright test`.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r requirements.txt

      # Supplies MINITRACK_API_KEYS (read by the config, and by the app itself)
      # and MINITRACK_CORS_ORIGINS -- without the latter CORSMiddleware is never
      # installed and every browser request fails its preflight.
      - name: Provide backend config
        working-directory: backend
        run: cp .env.example .env

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      # webServer[1] runs `npm run dev` with cwd ../frontend, so frontend deps
      # must be present even though no frontend test runs in this job.
      - run: npm ci
        working-directory: frontend

      - run: npm ci
        working-directory: e2e

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # CI=true is set by Actions, which turns on forbidOnly, retries: 2 and
      # workers: 1 from playwright.config.ts.
      - name: Run tests
        working-directory: e2e
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
